server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    autoindex off;
    default_type application/octet-stream;
    types {
        application/json json;
        application/octet-stream fre3app sig;
    }
    add_header X-Content-Type-Options nosniff always;

    location ~ /\. { deny all; }
    location / {
        limit_except GET HEAD { deny all; }
        try_files $uri =404;
    }
}
