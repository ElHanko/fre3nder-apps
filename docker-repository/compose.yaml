services:
  worker:
    build: .
    restart: unless-stopped
    init: true
    user: "${REPOSITORY_UID:-1000}:${REPOSITORY_GID:-1000}"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./local/config.toml:/config/config.toml:ro
      - ./local/secrets:/run/secrets:ro
      - ./local/data:/data

  http:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - worker
    ports:
      - "${REPOSITORY_BIND:-127.0.0.1}:${REPOSITORY_PORT:-8088}:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./local/data/public:/usr/share/nginx/html:ro
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
